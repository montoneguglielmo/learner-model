# Encoder exercise_embed_v1 with Qwen3-Embedding-4B (main choice).
# Small changes (other dim, other text settings) = a new config file.

exercises: ../MIAAM/data/maths_exercises_table.parquet

model:
  name: Qwen/Qwen3-Embedding-4B
  revision: main        # resolved to the exact commit hash at run time, saved in the manifest
  dtype: bfloat16
  device: cuda
  max_length: 4096      # tokens; our longest text is about 1,000-1,500 tokens
  batch_size: 16
  output_dim: 1024      # keep the first 1024 of 2560 values (Matryoshka). null = keep all
  prompt: null          # exercises are embedded as documents: no instruction

text:
  # Every column of the exercise table must be in one of these lists (otherwise the run
  # stops and names the missing ones). scripts/preview_exercise_texts.py checks this without a GPU.

  # Copied into the output (first value when an exercise is listed several times).
  # Must include exercise_id.
  keep_columns: [exercise_id, source, gameplay_type]
  # Written into the text, in this order. "content" is the exercise itself (parsed);
  # any other column becomes "<label> : <value>" (all its distinct values, joined with " ; ").
  text_columns: [module_name, objective_name, activity_name, gameplay_type, content]
  # Not used.
  drop_columns: [objective_pedagogical_intent, activity_pedagogical_intent]

  # What is taken from the content:
  include_correct_answer: true
  include_feedback_incorrect: true
  include_feedback_correct: false
