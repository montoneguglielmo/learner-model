# Encoder event_embed_v1 with Qwen3-Embedding-0.6B.
# One vector per event (about 6M rows): the small model keeps this to a few hours.
# Small changes (other dim, other columns) = a new config file.

events: ../MIAAM/data/maths_data_filtered.parquet

model:
  name: Qwen/Qwen3-Embedding-0.6B
  revision: main        # resolved to the exact commit hash at run time, saved in the manifest
  dtype: bfloat16
  device: cuda
  max_length: 512       # tokens; event texts are short
  batch_size: 256
  output_dim: 256       # keep the first 256 of 1024 values (Matryoshka). null = keep all
  prompt: null

text:
  # ALL the output columns, copied as they are (ids to join with other tables), not in the text.
  # Must include user_id and created_at (the output is sorted by them).
  keep_columns: [user_id, created_at, exercise_id, session_id, classroom_id, module_id, playlist_or_module_id]
  # What a model must predict: never in the text.
  target_columns: [data_correct, data_answer]
  # The ONLY columns written into the text, in this order. Any other column is not used.
  # Raw ids (UUIDs) are kept columns, not text: they carry little meaning as text,
  # and module_name already names the module.
  # Run scripts/preview_event_texts.py: it prints the columns that are "not used".
  text_columns: [module_name, work_mode, source, attempt_index, data_duration]
  include_nulls: false
  float_digits: 3
  max_value_chars: 300
