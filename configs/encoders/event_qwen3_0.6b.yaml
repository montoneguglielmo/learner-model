# Encoder event_embed_v1 with Qwen3-Embedding-0.6B.
# Two vectors per event (about 6M rows): the small model keeps this to a few hours.
# Small changes (other dim, other columns) = a new config file.

events: ../MIAAM/data/maths_data_filtered.parquet

model:
  name: Qwen/Qwen3-Embedding-0.6B
  revision: main        # resolved to the exact commit hash at run time, saved in the manifest
  dtype: bfloat16
  device: cuda
  max_length: 512       # tokens; event texts are short
  batch_size: 256
  output_dim: 256       # keep the first 256 of 1024 values (Matryoshka). null = keep all
  prompt: null

text:
  # Every column of the table must be in one of these lists (otherwise the run stops
  # and names the missing ones). scripts/preview_event_texts.py checks this without a GPU.

  # Copied as they are into the output (ids to join with other tables). Must include
  # user_id and created_at (the output is sorted by them).
  keep_columns: [user_id, created_at, exercise_id, session_id, classroom_id, module_id, playlist_or_module_id]
  # Written into the event text -> event_embedding (what the event is), in this order.
  embed_event_columns: [module_name, work_mode, source, attempt_index, data_duration, created_at]
  # Written into the result text -> result_embedding (what the student answered).
  # Never also in the event text.
  embed_result_columns: [data_correct, data_answer]
  # Not used.
  drop_columns: []

  include_nulls: false
  float_digits: 3
  max_value_chars: 300
