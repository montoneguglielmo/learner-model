# Sequence transformer (plan: "multi-student transformer for answer prediction").
# First experiments on a 24 GB GPU. A different setting = a new config file.

# Datasets (training/multi.py). Each block comes from one (dataset, source) group; batches mix
# groups. A source may be selected from one dataset only: V1 am and V2 am are the same students,
# split separately.
datasets:
  - events_id: event_embed_miaam_v2__2026-11-12__6c5069
    exercises_id: exercise_embed_miaam_v2__2026-11-16__f1d1c7
    split_id: split_students_miaam_v2__2026-11-10__7d163c
    sources: null           # null = all: am, adaptiv_world, adaptiv_college
    source_column: source   # null = the whole dataset is one source
    train_fraction: 1.0     # share of its train students used (val and test stay whole)
  - events_id: event_embed_miaam_v1__2026-11-16__a6a5f7
    exercises_id: exercise_embed_miaam_v1__2026-11-16__f1d1c7
    split_id: split_students_miaam_v1__2026-11-10__7d163c
    sources: [mia]          # am comes from V2
    source_column: source
    train_fraction: 1.0

block:
  n_targets: 3        # students whose answers get a loss, per block
  n_context: 12       # students that are only read
  max_events: 128      # events per student (a random window in training, the last ones in evaluation)
  min_events: 2       # shorter students are never targets
  seed: 0

model:
  d: 256
  n_layers: 6
  n_heads: 8
  ff_mult: 4
  dropout: 0.1
  max_events: 128      # must be >= block.max_events
  ex_dim: null        # e.g. 256: keep the first 256 values of the exercise vector. null = all
  correct_vector: true

train:
  batch_size: 16      # blocks per step
  lr: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 1000
  max_epochs: 200
  patience: 5         # stop after this many epochs without a better val AUC
  grad_clip: 1.0
  log_every: 50       # steps between W&B logs (the progress bar updates every step)
  val_max_students: null   # evaluate on a subset of val students each epoch (faster). null = all
  seed: 0
