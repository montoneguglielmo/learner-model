[project]
name = "learner-model"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "montone.guglielmo@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=2.2.0",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "pyyaml>=6.0.3",
    "sentence-transformers>=5.7.0",
    "torch>=2.14.1",
]

[project.scripts]
learner-model = "learner_model:main"

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"
